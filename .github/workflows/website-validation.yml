
name: Website Validation

on: push

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check HTML
        run: test -f index.html

      - name: Check CSS
        run: test -f style.css

      - name: Check JavaScript
        run: test -f script.js

      - name: Install ESLint
        run: npm install --no-save eslint@9

      - name: Check JavaScript code
        run: npx eslint script.js
